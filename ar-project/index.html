<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Dragon Fantasy AR Experience</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Updated library versions -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div id="loading-screen">
        <div class="loader-container">
            <div class="loader"></div>
            <p>Loading Dragon Fantasy AR Experience...</p>
        </div>
    </div>
    
    <div id="instructions">
        <p>Point your camera at the marker to see the dragon!</p>
        <button id="close-instructions">Got it!</button>
    </div>
    
    <div id="controls">
        <button id="sound-toggle">🔊</button>
        <button id="fullscreen-toggle">⛶</button>
    </div>

    <!-- Debug information -->
    <div id="debug-info" style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 10px; font-family: monospace; z-index: 9999; display: none;">
        Model status: Loading...
    </div>

    <a-scene 
        embedded
        arjs="sourceType: webcam; debugUIEnabled: true; detectionMode: mono_and_matrix; matrixCodeType: 3x3; patternRatio: 0.65;"
        renderer="logarithmicDepthBuffer: true; precision: mediump; antialias: true;"
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false">
        
        <!-- Use a default marker pattern for better compatibility -->
        <a-marker id="dragon-marker" preset="hiro">
            <a-entity
                id="dragon-model"
                position="0 0 0"
                rotation="-90 0 0"
                scale="0.1 0.1 0.1"
                gltf-model="./assets/models/black_dragon_with_idle_animation.glb"
                animation-mixer>
            </a-entity>
        </a-marker>
        
        <!-- Camera with fixed position entity for UI elements -->
        <a-entity camera></a-entity>
    </a-scene>
    
    <script>
    // Immediately executable debugging script
    document.addEventListener('DOMContentLoaded', function() {
        const debugInfo = document.getElementById('debug-info');
        debugInfo.style.display = 'block';
        
        // References to AR elements
        const scene = document.querySelector('a-scene');
        const marker = document.getElementById('dragon-marker');
        const model = document.getElementById('dragon-model');
        
        // Loading screen handling
        const loadingScreen = document.getElementById('loading-screen');
        
        // Check if scene has loaded
        if (scene.hasLoaded) {
            debugInfo.textContent = 'Scene loaded';
        } else {
            scene.addEventListener('loaded', function() {
                debugInfo.textContent = 'Scene loaded';
            });
        }
        
        // Check marker detection
        marker.addEventListener('markerFound', function() {
            debugInfo.textContent = 'Marker found';
            loadingScreen.style.display = 'none';
        });
        
        marker.addEventListener('markerLost', function() {
            debugInfo.textContent = 'Marker lost';
        });
        
        // Check model loading
        model.addEventListener('model-loaded', function(e) {
            debugInfo.textContent = 'Model loaded successfully';
            console.log('Model loaded successfully');
            
            // After model is loaded, play optional audio
            try {
                const audio = new Audio('./assets/audio/dragon-roar.mp3');
                document.addEventListener('click', function() {
                    audio.play();
                });
            } catch (e) {
                console.error('Audio error:', e);
            }
        });
        
        model.addEventListener('model-error', function(e) {
            debugInfo.textContent = 'Error loading model: ' + e.detail.src;
            console.error('Error loading model:', e);
        });
        
        // Close instructions button
        document.getElementById('close-instructions').addEventListener('click', function() {
            document.getElementById('instructions').style.display = 'none';
        });
        
        // Sound toggle button
        document.getElementById('sound-toggle').addEventListener('click', function() {
            const audio = new Audio('./assets/audio/dragon-roar.mp3');
            audio.play();
        });
        
        // Fullscreen toggle button
        document.getElementById('fullscreen-toggle').addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });
    });
    </script>
</body>
</html>
