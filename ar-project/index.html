<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon AR Experience</title>
    <link rel="stylesheet" href="./css/style.css">
    
    <!-- Important: Load in the correct order -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-container">
            <h1>Dragon AR Experience</h1>
            <p>Loading resources...</p>
            <div class="progress-bar">
                <div class="progress" id="loadingProgress"></div>
            </div>
        </div>
    </div>
    
    <div class="instructions" id="instructions">
        <div class="instructions-container">
            <h2>How to use:</h2>
            <p>1. Allow camera access</p>
            <p>2. Point your camera at the marker image</p>
            <p>3. Watch the dragon come to life!</p>
            <button id="startButton">Start Experience</button>
        </div>
    </div>

    <!-- AR Scene (Initially hidden) -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;" 
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        id="arScene"
        style="display: none;">
        
        <!-- Define custom marker -->
        <a-assets>
            <a-asset-item id="dragon-model" src="./assets/models/black_dragon_with_idle_animation.glb"></a-asset-item>
            <audio id="dragon-roar" src="./assets/audio/dragon-roar.mp3" preload="auto"></audio>
        </a-assets>

        <!-- Use a simpler pattern marker that comes with AR.js -->
        <a-marker preset="hiro" id="dragonMarker">
            <a-entity
                id="dragonModel"
                position="0 0 0"
                rotation="-90 0 0"
                scale="0.5 0.5 0.5"
                gltf-model="#dragon-model"
                animation-mixer="loop: repeat">
            </a-entity>
        </a-marker>

        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>

    <script src="./js/main.js"></script>
</body>
</html>
