<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon World AR</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Include all required libraries with specific versions -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div id="loading">
        <h1>Dragon World AR</h1>
        <div class="spinner"></div>
        <p>Loading your magical experience...</p>
    </div>
    
    <!-- Audio elements -->
    <audio id="dragonRoar" src="assets/audio/dragon-roar.mp3" preload="auto"></audio>
    
    <!-- A-Frame Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;">
        <!-- Assets management system -->
        <a-assets>
            <a-asset-item id="dragon-model" src="assets/models/black_dragon_with_idle_animation.glb"></a-asset-item>
        </a-assets>
        
        <!-- Marker definition -->
        <a-marker type="pattern" url="assets/markers/marker1.png" id="dragon-marker" emitevents="true">
            <!-- 3D Model -->
            <a-entity
                position="0 0 0"
                rotation="-90 0 0"
                scale="0.05 0.05 0.05"
                gltf-model="#dragon-model"
                animation-mixer="clip: *; loop: repeat">
            </a-entity>
            
            <!-- Particles for fire effect -->
            <a-entity id="fire-particles" position="0 0.5 0" visible="false">
                <a-entity id="fire" particle-system="preset: fire; color: #ff3300,#ffaa00; size: 0.5; particleCount: 50; blending: additive; opacity: 0.8"></a-entity>
            </a-entity>
        </a-marker>
        
        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>
    
    <script src="js/main.js"></script>
</body>
</html>
