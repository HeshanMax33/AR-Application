<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dragon AR Experience</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.8);
            color: white;
            z-index: 9999;
            font-family: Arial, sans-serif;
        }
        
        #errorMessage {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(255,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            z-index: 999;
            display: none;
        }
        
        #cameraPermissionButton {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- <div id="loading">Loading AR Experience...</div> -->
    <div id="errorMessage"></div>
    <button id="cameraPermissionButton">Start AR Experience</button>

    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.3.0/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.1/dist/mindar-image-aframe.prod.js"></script>

    <script>
        // Function to show error message
        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }

        // Function to initialize AR when camera permission is granted
        function initializeAR() {
            document.getElementById('cameraPermissionButton').style.display = 'none';
            document.getElementById('loading').style.display = 'flex';
            
            // Create AR scene dynamically
            const arScene = document.createElement('a-scene');
            arScene.setAttribute('embedded', '');
            arScene.setAttribute('arjs', 'sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;');
            
            // Create marker
            const marker = document.createElement('a-marker');
            marker.setAttribute('preset', 'hiro');
            marker.setAttribute('id', 'dragonMarker');
            
            // Create entity for the 3D model
            const modelEntity = document.createElement('a-entity');
            modelEntity.setAttribute('id', 'dragonModel');
            modelEntity.setAttribute('position', '0 0 0');
            modelEntity.setAttribute('rotation', '-90 0 0');
            modelEntity.setAttribute('scale', '0.05 0.05 0.05');
            modelEntity.setAttribute('gltf-model', './assets/models/black_dragon_with_idle_animation.glb');
            
            // Create camera entity
            const camera = document.createElement('a-entity');
            camera.setAttribute('camera', '');
            
            // Append elements
            marker.appendChild(modelEntity);
            arScene.appendChild(marker);
            arScene.appendChild(camera);
            document.body.appendChild(arScene);
            
            // Handle scene loaded
            arScene.addEventListener('loaded', function() {
                document.getElementById('loading').style.display = 'none';
                console.log('AR Scene loaded successfully');
            });
            
            // Handle marker detection
            marker.addEventListener('markerFound', function() {
                console.log('Marker detected!');
                
                // Play sound when marker is found
                const audio = new Audio('./assets/audio/dragon-roar.mp3');
                audio.play().catch(e => console.error('Audio play error:', e));
                
                // Add animation to model
                modelEntity.setAttribute('animation-mixer', '');
            });
            
            // Error handling for model loading
            modelEntity.addEventListener('model-error', function(e) {
                showError('Error loading 3D model. Please check file path.');
                console.error('Model error:', e);
            });
        }

        // Initialize camera with explicit user interaction
        document.getElementById('cameraPermissionButton').addEventListener('click', function() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function(stream) {
                    // Camera permission granted
                    stream.getTracks().forEach(track => track.stop()); // Stop the stream as AR.js will handle it
                    initializeAR();
                })
                .catch(function(error) {
                    showError('Camera access denied. Please enable camera permissions in your browser settings.');
                    console.error('Camera error:', error);
                });
        });

        // Check for WebGL support
        window.addEventListener('load', function() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            
            if (!gl) {
                showError('WebGL not supported. Your device may not be compatible with AR.');
            }
        });
    </script>
</body>
</html>
