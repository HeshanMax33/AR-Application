<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Racing Scenery Project</title>
    <meta name="description" content="Marker-based AR Application">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.9/dist/aframe-particle-system-component.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Add rotation controls script -->
    <script>
        // Component to make an entity rotate smoothly around its Y-axis
        AFRAME.registerComponent('rotate-model', {
            schema: {
                speed: {type: 'number', default: 1}
            },
            
            init: function() {
                this.rotation = 0;
            },
            
            tick: function(time, deltaTime) {
                if (!deltaTime) return;
                
                // Convert deltaTime from ms to seconds and calculate rotation change
                this.rotation += this.data.speed * (deltaTime / 1000);
                
                // Apply rotation to the entity
                this.el.setAttribute('rotation', {
                    x: 0,
                    y: this.rotation * 30, // Adjust speed by multiplying
                    z: 0
                });
            }
        });
        
        // Component to handle drag rotation on both desktop and mobile
        AFRAME.registerComponent('drag-rotate-component', {
            schema: { 
                speed: { default: 2 }
            },
            init: function() {
                this.ifMouseDown = false;
                this.x_cord = 0;
                this.y_cord = 0;
                this.yaw = 0;
                this.pitch = 0;
                
                this.model = this.el;
                
                // Desktop events
                document.addEventListener('mousedown', this.OnDocumentMouseDown.bind(this));
                document.addEventListener('mousemove', this.OnDocumentMouseMove.bind(this));
                document.addEventListener('mouseup', this.OnDocumentMouseUp.bind(this));
                
                // Mobile touch events
                document.addEventListener('touchstart', this.OnDocumentTouchStart.bind(this));
                document.addEventListener('touchmove', this.OnDocumentTouchMove.bind(this));
                document.addEventListener('touchend', this.OnDocumentTouchEnd.bind(this));
            },
            
            OnDocumentMouseDown: function(event) {
                if (!this.model.object3D.visible) return;
                this.ifMouseDown = true;
                this.x_cord = event.clientX;
                this.y_cord = event.clientY;
            },
            
            OnDocumentMouseMove: function(event) {
                if (!this.ifMouseDown) return;
                
                var temp_x = event.clientX - this.x_cord;
                var temp_y = event.clientY - this.y_cord;
                
                this.yaw += temp_x * this.data.speed * 0.1;
                this.pitch += temp_y * this.data.speed * 0.1;
                
                // Limit pitch to avoid flipping
                this.pitch = Math.max(-80, Math.min(80, this.pitch));
                
                this.model.setAttribute('rotation', {
                    x: this.pitch,
                    y: this.yaw,
                    z: 0
                });
                
                this.x_cord = event.clientX;
                this.y_cord = event.clientY;
            },
            
            OnDocumentMouseUp: function(event) {
                this.ifMouseDown = false;
            },
            
            OnDocumentTouchStart: function(event) {
                if (!this.model.object3D.visible) return;
                this.ifMouseDown = true;
                this.x_cord = event.touches[0].clientX;
                this.y_cord = event.touches[0].clientY;
            },
            
            OnDocumentTouchMove: function(event) {
                if (!this.ifMouseDown) return;
                
                var temp_x = event.touches[0].clientX - this.x_cord;
                var temp_y = event.touches[0].clientY - this.y_cord;
                
                this.yaw += temp_x * this.data.speed * 0.1;
                this.pitch += temp_y * this.data.speed * 0.1;
                
                // Limit pitch to avoid flipping
                this.pitch = Math.max(-80, Math.min(80, this.pitch));
                
                this.model.setAttribute('rotation', {
                    x: this.pitch,
                    y: this.yaw,
                    z: 0
                });
                
                this.x_cord = event.touches[0].clientX;
                this.y_cord = event.touches[0].clientY;
            },
            
            OnDocumentTouchEnd: function(event) {
                this.ifMouseDown = false;
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">
    <!-- Simple info overlay -->
    <div id="info" style="position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 10px; font-family: Arial, sans-serif; z-index: 100; display: none;">
        Tap on model to trigger effects<br>
        Drag to rotate model
    </div>

    <!-- Loading screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p>Loading AR Experience...</p>
        <p>Please allow camera access when prompted</p>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" 
        renderer="antialias: true; alpha: true; precision: mediump;"
        vr-mode-ui="enabled: false" 
        loading-screen="enabled: false">
        
        <!-- Your AR content -->
        <a-assets>
            <audio id="engine-sound" src="assets/audio/engine-sound.mp3" preload="auto"></audio>
        </a-assets>

        <a-marker preset="hiro" id="car-marker" emitevents="true">
            <!-- Parent entity to group the car and effects -->
            <a-entity 
                id="car-container" 
                position="0 0 0" 
                animation="property: position; from: 0 0 0; to: 0 0.1 0; dir: alternate; dur: 2000; loop: true;">
                
                <!-- McLaren P1 model with animations and rotation control -->
                <a-entity
                    id="car-model"
                    class="clickable"
                    position="0 0.1 0"
                    scale="0.5 0.5 0.5"
                    gltf-model="assets/models/free_mclaren_p1_gtr.glb"
                    drag-rotate-component="speed: 2"
                    sound="src: #engine-sound; autoplay: false; loop: true; volume: 0.8;"
                    animation__click="property: scale; startEvents: click; from: 0.5 0.5 0.5; to: 0.55 0.55 0.55; dur: 300; dir: alternate; loop: 3">
                </a-entity>
                
                <!-- Exhaust effect -->
                <a-entity 
                    id="exhaust-effect"
                    position="0 0.05 -0.2"
                    visible="false">
                    <a-sphere 
                        color="#888888" 
                        radius="0.05" 
                        opacity="0.7"
                        animation__pulse="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dur: 500; dir: alternate; loop: true; startEvents: showEffect">
                    </a-sphere>
                </a-entity>

                <!-- Add particle system when active -->
                <a-entity
                    id="particle-system"
                    position="0 0.05 -0.2"
                    particle-system="preset: dust; particleCount: 50; color: #888888, #AAAAAA; opacity: 0.7; size: 0.5; velocityValue: 0.1 0.1 0.1; enabled: false"
                    visible="false">
                </a-entity>
            </a-entity>
        </a-marker>

        <!-- Camera with cursor for interaction -->
        <a-entity camera>
            <a-entity 
                cursor="fuse: false"
                raycaster="objects: .clickable"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                material="color: white; shader: flat"
                visible="false">
            </a-entity>
        </a-entity>
    </a-scene>
    <script src="js/main.js"></script>
</body>
</html>
