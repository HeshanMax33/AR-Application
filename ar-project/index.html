<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Dragon AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.2/aframe/build/aframe-ar.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam;">
      <!-- Marker -->
      <a-marker preset="custom" type="pattern" url="assets/markers/maker1.patt">
        <!-- 3D Model -->
        <a-entity 
          gltf-model="assets/models/black_dragon_with_idle_animation.glb" 
          scale="0.5 0.5 0.5" 
          position="0 0 0"
          animation-mixer>
        </a-entity>
        <!-- Sound -->
        <a-sound 
          src="assets/audio/dragon-roar.mp3" 
          autoplay="true" 
          position="0 2 0">
        </a-sound>
      </a-marker>

      <!-- Camera -->
      <a-entity camera></a-entity>
    </a-scene>
    <script src="js/main.js"></script>
  </body>
</html>
