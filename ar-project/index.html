<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Racing Scenery Project</title>
    <meta name="description" content="Marker-based AR Application">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.9/dist/aframe-particle-system-component.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="margin: 0; overflow: hidden;">
    <!-- Simple info overlay -->
    <div id="info" style="position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 10px; font-family: Arial, sans-serif; z-index: 100; display: none;">
        Swipe left/right to rotate the car<br>
        Tap to trigger effects<br>
        Pinch to zoom
    </div>

    <!-- Control buttons -->
    <div id="control-buttons" style="position: fixed; bottom: 10px; right: 10px; z-index: 100; display: none;">
        <button id="rotate-left" style="background: rgba(0,0,0,0.7); color: white; border: none; padding: 10px; margin: 5px; border-radius: 5px;">⟲</button>
        <button id="rotate-right" style="background: rgba(0,0,0,0.7); color: white; border: none; padding: 10px; margin: 5px; border-radius: 5px;">⟳</button>
        <button id="toggle-auto-rotate" style="background: rgba(0,0,0,0.7); color: white; border: none; padding: 10px; margin: 5px; border-radius: 5px;">Auto</button>
    </div>

    <!-- Loading screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p>Loading AR Experience...</p>
        <p>Please allow camera access when prompted</p>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best;" 
        renderer="antialias: true; alpha: true; precision: mediump;"
        vr-mode-ui="enabled: false" 
        loading-screen="enabled: false">
        
        <!-- Your AR content -->
        <a-assets>
            <audio id="engine-sound" src="assets/audio/engine-sound.mp3" preload="auto"></audio>
        </a-assets>

        <a-marker preset="hiro" id="car-marker" emitevents="true" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="5">
            <!-- Parent entity to group the car and effects -->
            <a-entity 
                id="car-container" 
                position="0 0.1 0" 
                animation="property: position; from: 0 0.1 0; to: 0 0.2 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutQuad">
                
                <!-- McLaren P1 model with animations -->
                <a-entity
                    id="car-model"
                    class="clickable"
                    position="0 0 0"
                    rotation="0 0 0"
                    scale="0.5 0.5 0.5"
                    gltf-model="assets/models/free_mclaren_p1_gtr.glb"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear; startEvents: autoRotate; pauseEvents: pauseRotate"
                    sound="src: #engine-sound; autoplay: false; loop: true; volume: 0.8;"
                    animation__click="property: scale; startEvents: click; from: 0.5 0.5 0.5; to: 0.55 0.55 0.55; dur: 300; dir: alternate; loop: 3">
                </a-entity>
                
                <!-- Exhaust effect -->
                <a-entity 
                    id="exhaust-effect"
                    position="0 0.05 -0.2"
                    visible="false">
                    <a-sphere 
                        color="#888888" 
                        radius="0.05" 
                        opacity="0.7"
                        animation__pulse="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; dur: 500; dir: alternate; loop: true; startEvents: showEffect">
                    </a-sphere>
                </a-entity>

                <!-- Add particle system when active -->
                <a-entity
                    id="particle-system"
                    position="0 0.05 -0.2"
                    particle-system="preset: dust; particleCount: 50; color: #888888, #AAAAAA; opacity: 0.7; size: 0.5; velocityValue: 0.1 0.1 0.1; enabled: false"
                    visible="false">
                </a-entity>
            </a-entity>
        </a-marker>

        <!-- Camera with cursor for interaction -->
        <a-entity camera>
            <a-entity 
                cursor="fuse: false"
                raycaster="objects: .clickable"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                material="color: white; shader: flat"
                visible="false">
            </a-entity>
        </a-entity>
    </a-scene>
    <script src="js/main.js"></script>
</body>
</html>
