<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Fantasy AR Experience</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- AR.js and Three.js libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ar.js/3.3.1/ar.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
    <div id="loading-screen">
        <div class="loader-container">
            <div class="loader"></div>
            <p>Loading Dragon Fantasy AR Experience...</p>
        </div>
    </div>
    
    <div id="instructions">
        <p>Point your camera at the marker to see the dragon!</p>
        <button id="close-instructions">Got it!</button>
    </div>
    
    <div id="controls">
        <button id="sound-toggle">🔊</button>
        <button id="fullscreen-toggle">⛶</button>
    </div>

    <a-scene 
        embedded
        arjs='sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;'
        renderer='logarithmicDepthBuffer: true;'
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false">
        
        <!-- Dragon Marker -->
        <a-marker id="dragon-marker" type="pattern" url="assets/markers/marker1.png">
            <a-entity
                id="dragon-model"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1"
                gltf-model="assets/models/black_dragon_with_idle_animation.glb"
                animation-mixer="clip: Idle">
            </a-entity>
            <a-entity id="fire-particles" position="0 1 0"></a-entity>
        </a-marker>
        
        <!-- Additional Marker for another team member's contribution -->
        <a-marker id="secondary-marker" type="pattern" url="assets/markers/AR-MARKER-001">
            <a-entity
                id="secondary-model"
                position="0 0 0"
                rotation="0 0 0"
                scale="0.5 0.5 0.5"
                gltf-model="YOUR_SECONDARY_MODEL_PATH">
            </a-entity>
        </a-marker>
        
        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>
    
    <script src="js/main.js"></script>
</body>
</html>
